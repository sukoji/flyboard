<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FLYBOARD — countdown (render page)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@500;800&family=Noto+Sans+KR:wght@500;800&display=block" rel="stylesheet">
<style>
  :root { --acc: #4dabff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1920px; height: 1080px; overflow: hidden; background: #07080d; color: #f3f4f8; font-family: Inter, 'Noto Sans JP', 'Noto Sans KR', sans-serif; }
  canvas { position: absolute; display: block; }
  #brain { left: 520px; top: 60px; width: 820px; height: 960px; }
  #fly { left: 1340px; top: 110px; width: 560px; height: 520px; }
  .left { position: absolute; left: 60px; top: 56px; width: 440px; }
  .kicker { font-family: Anton, Impact, sans-serif; font-size: 44px; color: var(--acc); }
  .title { font-weight: 800; font-size: 46px; line-height: 1.12; margin-top: 8px; }
  .artist { color: #8a90a3; font-size: 22px; margin-top: 8px; }
  .cover { width: 400px; height: 400px; margin-top: 30px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .score { position: absolute; left: 60px; top: 800px; }
  .score b { font-family: Anton, Impact, sans-serif; font-size: 110px; font-weight: 400; color: var(--acc); line-height: 1; }
  .score small { display: block; color: #8a90a3; font-size: 15px; margin-top: 8px; }
  .scale { position: absolute; left: 60px; top: 1000px; width: 420px; height: 12px; background: #1a1f2d; border-radius: 99px; }
  .scale i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acc); border-radius: 99px; }
  .scale em { position: absolute; top: -30px; font-style: normal; font-size: 13px; color: #9ecbff; transform: translateX(-50%); }
  .tag { position: absolute; font-size: 15px; font-weight: 800; letter-spacing: 2px; color: #8a90a3; }
  .mood { position: absolute; left: 1340px; top: 600px; width: 560px; text-align: center; font-size: 30px; font-weight: 800; }
  .clock { position: absolute; left: 1340px; top: 78px; width: 560px; text-align: center; font: 15px ui-monospace, monospace; color: #8a90a3; }
  .meters { position: absolute; left: 1380px; top: 660px; width: 500px; }
  .meter { display: grid; grid-template-columns: 130px 1fr 170px; gap: 14px; align-items: center; margin: 12px 0; font-size: 16px; }
  .meter b { font-weight: 800; }
  .meter .bar { height: 12px; background: #1a1f2d; border-radius: 99px; overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: var(--acc); }
  .meter span { color: #8a90a3; font-size: 13px; }
  .firing { position: absolute; left: 520px; top: 1010px; width: 820px; text-align: center; font: 17px ui-monospace, monospace; color: #8a90a3; }
  #card { position: absolute; inset: 0; display: none; padding: 0 0 0 110px; flex-direction: column; justify-content: center; background: transparent; }
  #card h1 { font-family: Anton, Impact, sans-serif; font-size: 170px; font-weight: 400; line-height: 1; }
  #card p { font-size: 38px; font-weight: 800; margin-top: 18px; }
  #card small { font-size: 24px; color: #8a90a3; margin-top: 14px; }
  #card .url { color: #c77dff; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="brain"></canvas>
<canvas id="fly"></canvas>
<div id="seg">
  <div class="left"><div class="kicker" id="kicker"></div><div class="title" id="title"></div><div class="artist" id="artist"></div><img class="cover" id="cover"></div>
  <div class="score"><b id="score"></b><small>FLY SCORE · 0 = white noise · 100 = brain's response to fly love song</small></div>
  <div class="scale"><i id="bar"></i><em id="ref">fly song ▼</em></div>
  <div class="tag" style="left:520px;top:70px;width:820px;text-align:center">BRAIN + NERVE CORD · 140,024 NEURONS</div>
  <div class="tag" style="left:1340px;top:48px;width:560px;text-align:center">BODY · DRIVEN BY ITS MOTOR NEURONS</div>
  <div class="clock" id="clock"></div>
  <div class="mood" id="mood"></div>
  <div class="meters" id="meters"></div>
  <div class="firing" id="firing"></div>
</div>
<div id="card"></div>
<script type="module" src="js/video.js"></script>
</body>
</html>
